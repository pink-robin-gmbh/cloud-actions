name: Deploy version on Kubernetes with Helmfile

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deploy to'
        default: Development
        type: string
        required: true
      environment_identifier:
        description: "Shortname/identifier of the selected environment"
        type: string
        required: true
      environment_cluster:
        description: "Name of the EKS cluster"
        type: string
        required: true
      repository:
        description: "Path/name of container repository (without registry URL)"
        type: string
        required: true
      version_core:
        description: "Override core version"
        type: string
      version_web:
        description: "Override web version"
        type: string
      version_ui:
        description: "Override UI version"
        type: string
      version_auth:
        description: "Override auth version"
        type: string
      helmfile:
        description: "Helmfile deployment file"
        type: string
        default: deployment
      restart:
        description: "Restart deployment"
        type: boolean
        default: true
      namespace:
        description: "Namespace to deploy to"
        type: string

    secrets:
      aws_secret_access_key:
        description: "AWS Secret Access Key for Secrets Manager & ASG"
        required: true
      aws_access_key_id:
        description: "AWS Access Key ID for Secrets Manager & ASG"
        required: true
      aws_region:
        description: "AWS Region for Secrets Manager & ASG"
        required: true

    outputs:
      system_versions:
        description: "Computed versions for all services"
        value: ${{ jobs.Version.outputs.system_versions }}
      commit:
        description: "Git commit hash"
        value: ${{ jobs.Version.outputs.commit }}
      short:
        description: "Short git hash"
        value: ${{ jobs.Version.outputs.short }}

jobs:
  Version:
    runs-on: [ self-hosted, fastlane ]
    environment:
      name: ${{ inputs.environment }}
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      short: ${{ steps.version.outputs.short }}
      system_versions: ${{ steps.version.outputs.system_versions }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        name: Derive version / tag
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/pink-robin-gmbh/cloud-actions/main/helpers/generate-version.sh)" -- -j -s version
          source version.sh
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "short=$SHORT" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "docker_tag=$DOCKER_TAG" >> $GITHUB_OUTPUT
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "deployment_tag=${DOCKER_TAG:-${LATEST_TAG:-main-latest}}" >> $GITHUB_OUTPUT
          ENV_ID='${{ inputs.environment_identifier }}'
          ENV_ID=${ENV_ID:-unknown}
          if [ "$ENV_ID" = "unknown" ]; then echo "::error::Environment identifier is missing"; exit 1; fi

          FALLBACK_VERSION="${DOCKER_TAG:-${LATEST_TAG:-main-latest}}"
          VERSION_OVERRIDE='{"core":"${{ inputs.version_core }}","web":"${{ inputs.version_web }}","ui":"${{ inputs.version_ui }}","auth":"${{ inputs.version_auth }}"}'
          VERSION_OUTPUTS='{}'
          SYSTEMS='core,web,ui,auth'
          for SYSTEM_NAME in ${SYSTEMS//,/ }
          do
            if [[ "$SYSTEM_NAME" != *"gateway"* ]]; then
              SYSTEM_VERSION="$(echo "$VERSION_OVERRIDE" | jq -r ".\"${SYSTEM_NAME%%-*}\" // empty")"
              SYSTEM_VERSION=${SYSTEM_VERSION:-$FALLBACK_VERSION}
              SYSTEM_VERSION="$(echo "$SYSTEM_VERSION" | tr '[:upper:]' '[:lower:]')" # Convert to lowercase

              # Sanitize tag / branch name
              if [[ "$SYSTEM_VERSION" =~ ^v?([0-9]+)(\.([0-9]+)(\.([0-9]+))?)?$ ]]; then
                SYSTEM_VERSION=${SYSTEM_VERSION#"v"}
              else
                SYSTEM_VERSION="$(echo ${SYSTEM_VERSION%-latest} | tr \/\. - | sed "s/[^0-9a-z\-]//g")-latest"
              fi

              # Add version to output
              VERSION_OUTPUTS=$(jq -rc ".\"${SYSTEM_NAME//-/_}\" = \"$SYSTEM_VERSION\"" <<< "$VERSION_OUTPUTS")
            fi
          done

          # Set output & log
          echo "system_versions=$VERSION_OUTPUTS" >> $GITHUB_OUTPUT
          echo "::notice::🏷️  Computed versions: $VERSION_OUTPUTS"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.aws_access_key_id }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key }}
          aws-region: ${{ secrets.aws_region }}

      - name: Validate image availability
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          echo "ℹ️  Check images on AWS Account $(echo "$ACCOUNT_ID" | sed 's/./& /g')"
          FALLBACK_VERSION="${{ steps.version.outputs.deployment_tag }}"
          SYSTEMS='core,web,ui,auth'
          for SYSTEM_NAME in ${SYSTEMS//,/ }
          do
            if [[ "$SYSTEM_NAME" != *"gateway"* ]]; then
              ECR_REPO=$(echo "${{ inputs.repository }}" | cut -d'-' -f 1 -)-$(echo "$SYSTEM_NAME" | cut -d'-' -f 1)
              SELECTED_VERSION=$(echo '${{ steps.version.outputs.system_versions }}' | jq -rc ".\"${SYSTEM_NAME//-/_}\" // empty")
              SYSTEM_VERSION=${SELECTED_VERSION:-$FALLBACK_VERSION}
              if [[ "$(aws ecr describe-images --registry-id $ACCOUNT_ID --repository-name "$ECR_REPO" --image-ids imageTag="$SYSTEM_VERSION" | jq '.imageDetails | length')" == "1" ]]; then
                echo "🐳  $ECR_REPO:$SYSTEM_VERSION exists";
              else
                echo "::error::❌  Docker image for $ECR_REPO:$(echo "$SYSTEM_VERSION" | sed 's/./& /g') not found";
                exit 1
              fi
              echo "::notice::🐳  Docker image for $SYSTEM_NAME is available in version $SYSTEM_VERSION"
            else
              echo "::notice::⏭️  Skipping check for $SYSTEM_NAME"
            fi
          done
          echo "::notice::✅  Docker images for all systems are available in versions"
  Deploy:
    name: Deploy with Helmfile
    needs: Version
    runs-on: [ self-hosted, fastlane ]
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.aws_access_key_id }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key }}
          aws-region: ${{ secrets.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update and generate kubeconfig
        run: |
          # Generate kubeconfig and save to environment variable
          {
            echo 'KUBE_CONFIG<<EOF'
            aws eks update-kubeconfig --region ${{ secrets.aws_region }} --name ${{ inputs.environment_cluster }} --dry-run | base64
            echo EOF
          } >> $GITHUB_ENV

      - name: Write kubeconfig to file
        run: |
          mkdir -p $HOME/.kube
          echo "${{ env.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV  # <-- expose it to following steps

      - name: Verify kubeconfig connectivity
        uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ env.KUBE_CONFIG }}

      - name: Test cluster connection
        run: |
          echo "::notice::Testing connection to EKS cluster: ${{ inputs.environment_cluster }}"
          kubectl cluster-info
          kubectl get nodes
          echo "::notice::✅ Successfully connected to Kubernetes cluster"

      - name: Prepare Helmfile arguments
        id: prepare-helmfile
        run: |
          # Use computed versions from Version job
          SYSTEM_VERSIONS='${{ needs.Version.outputs.system_versions }}'

          if [ -n "$SYSTEM_VERSIONS" ] && [ "$SYSTEM_VERSIONS" != "null" ]; then
            echo "::notice::Using computed versions from Version job"

            # Extract versions from JSON
            VERSION_AUTH=$(echo "$SYSTEM_VERSIONS" | jq -r '.auth // empty')
            VERSION_CORE=$(echo "$SYSTEM_VERSIONS" | jq -r '.core // empty')
            VERSION_WEB=$(echo "$SYSTEM_VERSIONS" | jq -r '.web // empty')
            VERSION_UI=$(echo "$SYSTEM_VERSIONS" | jq -r '.ui // empty')

            echo "VERSION_AUTH=$VERSION_AUTH" >> $GITHUB_ENV
            echo "VERSION_CORE=$VERSION_CORE" >> $GITHUB_ENV
            echo "VERSION_WEB=$VERSION_WEB" >> $GITHUB_ENV
            echo "VERSION_UI=$VERSION_UI" >> $GITHUB_ENV

          else
            echo "::warning::Could not extract computed versions"
          fi

      - name: Setup Helm, Helmfile and helm-diff
        run: |
          # Install Helm v4.1.1
          curl -Lo /tmp/helm.tar.gz https://get.helm.sh/helm-v4.1.1-linux-amd64.tar.gz
          tar -xzf /tmp/helm.tar.gz -C /tmp linux-amd64/helm
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          echo "::notice::helm: $(helm version --short)"

          # Install Helmfile v1.2.3
          curl -Lo /tmp/helmfile.tar.gz https://github.com/helmfile/helmfile/releases/download/v1.2.3/helmfile_1.2.3_linux_amd64.tar.gz
          tar -xzf /tmp/helmfile.tar.gz -C /tmp helmfile
          sudo mv /tmp/helmfile /usr/local/bin/helmfile
          echo "::notice::helmfile: $(helmfile --version)"

          # Install helm-diff (remove existing first to avoid conflicts)
          rm -rf /home/ec2-user/.local/share/helm/plugins/helm-diff
          helm plugin install https://github.com/databus23/helm-diff --verify=false
          echo "::notice::helm-diff: $(helm plugin list | grep diff)"

          echo "::notice::Helm repos ready"

      - name: Build Helm chart dependencies
        run: |
          for chart in ${{ inputs.helmfile }}/charts/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "::notice::Building dependencies for $chart"
              helm dependency update "$chart"
              helm dependency build "$chart"   
            fi
          done

      - name: Helmfile Diff - Preview Changes
        run: |
          helmfile diff --skip-deps --file ${{ inputs.helmfile }} --environment ${{ inputs.environment_identifier }}

      - name: Helmfile Apply - Sync Changes
        run: |
          helmfile sync --file ${{ inputs.helmfile }} --environment ${{ inputs.environment_identifier }}

      - name: Check deployed pods
        run: |
          echo "::notice::Rollout pods in namespace wastebox-${{ inputs.environment_identifier }}"

          #if [ -n "$RESTART" ] && [ -n "$NAMESPACE" ]; then
            echo "::notice:: Restarting deployment: $RESTART"
            #kubectl rollout restart deployment -n $NAMESPACE -l $RESTART
            kubectl rollout restart deployment -n wastebox-${{ inputs.environment_identifier }} -l true
          #fi
