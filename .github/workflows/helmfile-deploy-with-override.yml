name: Deploy version on Kubernetes with Helmfile

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deploy to'
        default: Development
        type: string
        required: true
      environment_identifier:
        description: "Shortname/identifier of the selected environment"
        type: string
        required: true
      environment_cluster:
        description: "Name of the EKS cluster"
        type: string
        required: true
      repository:
        description: "Path/name of container repository (without registry URL)"
        type: string
        required: true
      version_core:
        description: "Override core version"
        type: string
      version_web:
        description: "Override web version"
        type: string
      version_ui:
        description: "Override UI version"
        type: string
      version_auth:
        description: "Override auth version"
        type: string

    secrets:
      aws_secret_access_key:
        description: "AWS Secret Access Key for Secrets Manager & ASG"
        required: true
      aws_access_key_id:
        description: "AWS Access Key ID for Secrets Manager & ASG"
        required: true
      aws_region:
        description: "AWS Region for Secrets Manager & ASG"
        required: true

    outputs:
      system_versions:
        description: "Computed versions for all services"
        value: ${{ jobs.Version.outputs.system_versions }}
      commit:
        description: "Git commit hash"
        value: ${{ jobs.Version.outputs.commit }}
      short:
        description: "Short git hash"
        value: ${{ jobs.Version.outputs.short }}

jobs:
  Version:
    runs-on: [self-hosted, fastlane]
    environment:
      name: ${{ inputs.environment }}
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      short: ${{ steps.version.outputs.short }}
      system_versions: ${{ steps.version.outputs.system_versions }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        name: Derive version / tag
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/pink-robin-gmbh/cloud-actions/main/helpers/generate-version.sh)" -- -j -s version
          source version.sh
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "short=$SHORT" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "docker_tag=$DOCKER_TAG" >> $GITHUB_OUTPUT
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "deployment_tag=${DOCKER_TAG:-${LATEST_TAG:-main-latest}}" >> $GITHUB_OUTPUT
          ENV_ID='${{ inputs.environment_identifier }}'
          ENV_ID=${ENV_ID:-unknown}
          if [ "$ENV_ID" = "unknown" ]; then echo "::error::Environment identifier is missing"; exit 1; fi

          FALLBACK_VERSION="${DOCKER_TAG:-${LATEST_TAG:-main-latest}}"
          VERSION_OVERRIDE='{"core":"${{ inputs.version_core }}","web":"${{ inputs.version_web }}","ui":"${{ inputs.version_ui }}","auth":"${{ inputs.version_auth }}"}'
          VERSION_OUTPUTS='{}'
          SYSTEMS='core,web,ui,auth'
          for SYSTEM_NAME in ${SYSTEMS//,/ }
          do
            if [[ "$SYSTEM_NAME" != *"gateway"* ]]; then
              SYSTEM_VERSION="$(echo "$VERSION_OVERRIDE" | jq -r ".\"${SYSTEM_NAME%%-*}\" // empty")"
              SYSTEM_VERSION=${SYSTEM_VERSION:-$FALLBACK_VERSION}
              SYSTEM_VERSION="$(echo "$SYSTEM_VERSION" | tr '[:upper:]' '[:lower:]')" # Convert to lowercase

              # Sanitize tag / branch name
              if [[ "$SYSTEM_VERSION" =~ ^v?([0-9]+)(\.([0-9]+)(\.([0-9]+))?)?$ ]]; then
                SYSTEM_VERSION=${SYSTEM_VERSION#"v"}
              else
                SYSTEM_VERSION="$(echo ${SYSTEM_VERSION%-latest} | tr \/\. - | sed "s/[^0-9a-z\-]//g")-latest"
              fi

              # Add version to output
              VERSION_OUTPUTS=$(jq -rc ".\"${SYSTEM_NAME//-/_}\" = \"$SYSTEM_VERSION\"" <<< "$VERSION_OUTPUTS")
            fi
          done

          # Set output & log
          echo "system_versions=$VERSION_OUTPUTS" >> $GITHUB_OUTPUT
          echo "::notice::🏷️  Computed versions: $VERSION_OUTPUTS"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.aws_access_key_id }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key }}
          aws-region: ${{ secrets.aws_region }}

  Deploy:
    name: Deploy with Helmfile
    needs: Version
    runs-on: [self-hosted, fastlane]
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.aws_access_key_id }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key }}
          aws-region: ${{ secrets.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update and generate kubeconfig
        run: |
          {
            echo 'KUBE_CONFIG<<EOF'
            aws eks update-kubeconfig --region ${{ secrets.aws_region }} --name ${{ inputs.environment_cluster }} --dry-run | base64
            echo EOF
          } >> $GITHUB_ENV

      - name: Prepare Helmfile arguments
        id: prepare-helmfile
        run: |
          # Build version override arguments
          HELMFILE_ARGS="apply --environment ${{ inputs.environment_identifier }}"

          # Use computed versions from Version job
          SYSTEM_VERSIONS='${{ needs.Version.outputs.system_versions }}'

          if [ -n "$SYSTEM_VERSIONS" ] && [ "$SYSTEM_VERSIONS" != "null" ]; then
            echo "::notice::Using computed versions from Version job"

            # Extract versions from JSON
            VERSION_AUTH=$(echo "$SYSTEM_VERSIONS" | jq -r '.auth // empty')
            VERSION_CORE=$(echo "$SYSTEM_VERSIONS" | jq -r '.core // empty')
            VERSION_WEB=$(echo "$SYSTEM_VERSIONS" | jq -r '.web // empty')
            VERSION_UI=$(echo "$SYSTEM_VERSIONS" | jq -r '.ui // empty')

            if [ -n "$VERSION_AUTH" ]; then
              HELMFILE_ARGS="$HELMFILE_ARGS --state-values-set auth.image.tag=$VERSION_AUTH"
              echo "::notice::🏷️  Auth version: $VERSION_AUTH"
            fi

            if [ -n "$VERSION_CORE" ]; then
              HELMFILE_ARGS="$HELMFILE_ARGS --state-values-set api.image.tag=$VERSION_CORE"
              echo "::notice::🏷️  Core/API version: $VERSION_CORE"
            fi

            if [ -n "$VERSION_WEB" ]; then
              HELMFILE_ARGS="$HELMFILE_ARGS --state-values-set web.image.tag=$VERSION_WEB"
              echo "::notice::🏷️  Web version: $VERSION_WEB"
            fi

            if [ -n "$VERSION_UI" ]; then
              HELMFILE_ARGS="$HELMFILE_ARGS --state-values-set ui.image.tag=$VERSION_UI"
              echo "::notice::🏷️  UI version: $VERSION_UI"
            fi
          else
            echo "::warning::Could not extract computed versions"
          fi

          echo "args=$HELMFILE_ARGS" >> $GITHUB_OUTPUT
          echo "::notice::📦 Helmfile args: $HELMFILE_ARGS"

      - name: Install Helm plugins
        run: |
          helm plugin install https://github.com/databus23/helm-diff --verify=false

      - name: Deploy with Helmfile
        uses: helmfile/helmfile-action@v1
        with:
          helmfile-args: --file deployment/helmfile.yaml.gotmpl ${{ steps.prepare-helmfile.outputs.args }}
          helmfile-version: latest
        env:
          KUBECONFIG_DATA: ${{ env.KUBE_CONFIG }}

      - name: Verify deployment
        uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ env.KUBE_CONFIG }}

      - name: Check deployed pods
        run: |
          echo "::notice::Checking pods in namespace wastebox-${{ inputs.environment_identifier }}"
          kubectl get pods -n wastebox-${{ inputs.environment_identifier }} --show-labels
